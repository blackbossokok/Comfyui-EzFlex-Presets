<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ModelsCombo 面板预览</title>
<style>
/* ===== 直接取自已加载的 MC_CSS，改这里 → 改完复制回 modelscombo_node.js ===== */
.mc-node-shell{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;pointer-events:none;overflow:hidden;}
.mc-node-shell .mc-node-root{pointer-events:auto;}
.mc-node-root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1e1c1a;background:#f5f2ed;border-radius:10px;padding:2px;display:flex;flex-direction:column;gap:4px;width:auto;min-width:0;min-height:auto;height:auto;box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0 14px;overflow:hidden;}
.mc-node-root select{user-select:none;-webkit-user-select:none;}
.mc-bar{display:flex;gap:4px;align-items:center;}
.mc-add{flex:1;min-width:0;height:26px;padding:4px 8px;font-size:11px;border:1px solid #d6cec4;border-radius:6px;background:#fff;color:#1e1c1a;outline:none;cursor:pointer;transition:.15s ease;font-family:inherit;box-sizing:border-box;}
.mc-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:auto;padding:2px;}
.mc-row{display:flex;flex-wrap:nowrap;gap:2px;align-items:center;padding:5px 6px;border:1px solid #ece6de;border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.03);transition:.15s ease;}
.mc-row:hover{border-color:#d6cec4;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.mc-idx{flex:0 0 auto;font-size:9px;color:#a89a8a;min-width:15px;text-align:center;font-feature-settings:"tnum";}
.mc-type{flex:0 0 50px;min-width:0;padding:3px 4px;font-size:9px;border:1px solid #d6cec4;border-radius:5px;background:#faf8f6;color:#1e1c1a;outline:none;cursor:pointer;font-family:inherit;}
.mc-name{flex:0.4 1 0;min-width:54px;padding:3px 4px;font-size:9px;border:1px solid #d6cec4;border-radius:5px;background:#fff;outline:none;font-family:inherit;transition:.15s ease;}
.mc-param{flex:0.7 1 0;min-width:46px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.02);border:1px solid #ece6de;border-radius:5px;padding:3px 2px;}
.mc-plabel{font-size:8px;color:#8a7a6a;font-weight:600;letter-spacing:.2px;white-space:nowrap;text-transform:uppercase;}
.mc-param select{flex:1 1 0;min-width:38px;padding:2px 4px;font-size:10px;border:1px solid #d6cec4;border-radius:4px;background:#fff;outline:none;cursor:pointer;font-family:inherit;}
.mc-range-wrap{display:flex;align-items:center;gap:3px;flex:1 1 0;min-width:54px;margin-right:8px;border:1px dashed transparent;}
.mc-range-wrap:last-child{margin-right:0;}
.mc-range{flex:1 1 auto;min-width:0;max-width:none;height:4px;-webkit-appearance:none;appearance:none;background:#d6cec4;border-radius:2px;outline:none;padding:0;margin:0;}
.mc-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#2b3a4a;cursor:pointer;border:1px solid #1a2530;}
.mc-range-num{flex:0 0 22px;width:22px;padding:2px 0;font-size:9px;border:1px solid #d6cec4;border-radius:4px;background:#fff;outline:none;font-family:inherit;-moz-appearance:textfield;text-align:center;box-sizing:border-box;}
.mc-target{flex:0.45 1 0;min-width:30px;padding:3px 3px;font-size:9px;border:1px solid #d6cec4;border-radius:5px;background:#faf8f6;outline:none;cursor:pointer;font-family:inherit;}
.mc-del{flex:0 0 auto;width:22px;height:22px;border:none;border-radius:5px;background:transparent;color:#b8aea2;cursor:pointer;font-size:12px;line-height:1;transition:.15s ease;}
.mc-empty{display:flex;align-items:center;justify-content:center;min-height:120px;flex:1 1 auto;color:#b8aea2;background:rgba(0,0,0,.02);border:1px dashed #d6cec4;border-radius:6px;margin:2px;font-size:12px;}
.mc-preset-name{flex:0 0 84px;min-width:58px;height:26px;padding:4px 8px;font-size:10px;border:1px solid #d6cec4;border-radius:5px;background:#fff;outline:none;font-family:inherit;box-sizing:border-box;}
.mc-preset-btn{height:26px;padding:4px 12px;font-size:10px;font-weight:600;border:1px solid #2b3a4a;border-radius:5px;background:#2b3a4a;color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s ease;box-sizing:border-box;}
.mc-preset-sel{flex:0 0 92px;min-width:64px;height:26px;padding:4px 6px;font-size:10px;border:1px solid #d6cec4;border-radius:5px;background:#fff;outline:none;cursor:pointer;font-family:inherit;box-sizing:border-box;}
.mc-combo{position:relative;flex:1.5 1 0;min-width:110px;}
.mc-combo-trigger{width:100%;height:26px;padding:4px 6px;font-size:10px;border:1px solid #d6cec4;border-radius:5px;background:#fff;outline:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;box-sizing:border-box;}
.mc-combo-value{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:#1e1c1a;}
.mc-combo-arrow{flex:0 0 auto;font-size:8px;color:#a89a8a;}
.mc-grip{flex:0 0 auto;width:16px;height:auto;color:#b8aea2;cursor:grab;font-size:11px;text-align:center;user-select:none;}
.mc-lora-divider{display:flex;align-items:center;gap:8px;margin:4px 10px 4px;height:10px;flex:0 0 auto;}
.mc-lora-divider::before,.mc-lora-divider::after{content:'';flex:1 1 0;height:1px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.14));}
.mc-lora-divider::after{background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,0));}
.mc-lora-divider .mc-lora-tag{flex:0 0 auto;font-size:8px;color:#a89a8a;letter-spacing:.4px;text-transform:uppercase;user-select:none;}
</style>
</head>
<body style="background:#e8e8ee;padding:20px;font:14px Inter,sans-serif;">
  <div style="max-width:1000px;margin:0 auto;">
    <h3 style="color:#333;margin:0 0 12px;">ModelsCombo 面板预览（双击本文件即改；改完把 &lt;style&gt; 里的 CSS 复制回 modelscombo_node.js 的 MC_CSS）</h3>

    <!-- 模拟一个节点，.mc-node-shell 是全节点透明壳 -->
    <div style="position:relative;width:880px;border:1px dashed #b8b8c0;border-radius:12px;padding:20px 32px;background:#fafafa;">
      <div class="mc-node-shell" style="width:880px;height:280px;position:relative;border:1px solid #cbb;">
        <div class="mc-node-root" id="panel" style="position:absolute;left:14px;right:14px;top:0;bottom:auto;">
          <!-- 工具栏 -->
          <div class="mc-bar">
            <button class="mc-add">＋ 添加加载器…</button>
            <select class="mc-preset-sel"><option>未选择预置</option></select>
            <input class="mc-preset-name" placeholder="预设名">
            <button class="mc-preset-btn">保存</button>
            <select class="mc-preset-sel"><option>选择预设</option></select>
            <button class="mc-preset-btn">加载</button>
            <button class="mc-preset-btn" style="background:#c0392b;border-color:#c0392b;">删除</button>
          </div>
          <!-- 加载器列表 -->
          <div class="mc-list" id="list">
            <div class="mc-row">
              <span class="mc-idx">1</span>
              <select class="mc-type"><option>UNET</option></select>
              <input class="mc-name" value="UNET_0">
              <div class="mc-combo"><button class="mc-combo-trigger"><span class="mc-combo-value">ANIMA|anima-base-v1.0-fp8mixed.safetensors…</span><span class="mc-combo-arrow">▾</span></button></div>
              <div class="mc-param"><span class="mc-plabel">设备</span><select><option>default</option></select></div>
              <div class="mc-param"><span class="mc-plabel">权重类型</span><select><option>default</option></select></div>
              <span class="mc-grip"></span>
              <button class="mc-del">✕</button>
            </div>
            <div class="mc-row">
              <span class="mc-idx">2</span>
              <select class="mc-type"><option>CLIP</option></select>
              <input class="mc-name" value="CLIP_0">
              <div class="mc-combo"><button class="mc-combo-trigger"><span class="mc-combo-value">qwen|Qwen3-0.6B-DavidAU-heretic…</span><span class="mc-combo-arrow">▾</span></button></div>
              <div class="mc-param"><span class="mc-plabel">类型</span><select><option>stable_diffusion</option></select></div>
              <div class="mc-param"><span class="mc-plabel">设备</span><select><option>default</option></select></div>
            </div>
            <div class="mc-lora-divider"><span class="mc-lora-tag">LoRA</span></div>
            <div class="mc-row">
              <span class="mc-idx">3</span>
              <select class="mc-type"><option>LoRA</option></select>
              <input class="mc-name" value="LoRA_0">
              <div class="mc-combo"><button class="mc-combo-trigger"><span class="mc-combo-value">其他|lora|MinimaxH3|Mystic…</span><span class="mc-combo-arrow">▾</span></button></div>
              <div class="mc-param"><span class="mc-plabel">模型</span><input type="range" class="mc-range" value="1.0"><input class="mc-range-num" value="1.0"></div>
              <div class="mc-param"><span class="mc-plabel">CLIP</span><input type="range" class="mc-range" value="1.0"><input class="mc-range-num" value="1.0"></div>
              <select class="mc-target"><option>UNET_0</option></select>
            </div>
          </div>
        </div>
      </div>
      <p style="margin:8px 0 0;font-size:12px;color:#888;">↑ 上面是 .mc-node-shell（透明壳）+ .mc-node-root（面板）。当前面板 <code>height:auto</code>，靠下方 <code>applyAutoHeight</code> 把节点高度设成内容高。</p>
    </div>
  </div>
</body>
</html>
