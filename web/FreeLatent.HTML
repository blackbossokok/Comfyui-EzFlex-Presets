<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分辨率选择器 · 独立预设版</title>
    <style>
        /* ===== 全局变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #e8eaef;
            --surface: #ffffff;
            --surface-hover: #f5f6fa;
            --border: #d0d5dd;
            --border-light: #e2e6ee;
            --primary: #6b6bff;
            --primary-light: #edebff;
            --primary-hover: #5a5ae5;
            --text: #1a1a2e;
            --text-secondary: #5a6a7e;
            --text-muted: #8a9aa8;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --port-size: 16px;
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            margin: 0;
        }
        .app {
            max-width: 1260px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px 28px;
            border: 1px solid var(--border);
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }
        .app-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-title .badge {
            font-size: 11px;
            font-weight: 500;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(107,107,255,0.15);
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-actions label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .top-actions select, .top-actions input {
            font-family: var(--font);
            font-size: 13px;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: border var(--transition), box-shadow var(--transition);
            min-width: 60px;
        }
        .top-actions select:focus, .top-actions input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(107,107,255,0.12);
        }
        .top-actions .limit-custom-input {
            min-width: 70px;
            width: 90px;
        }
        .top-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .top-btn:hover {
            background: var(--surface-hover);
            border-color: #b8c0cc;
            color: var(--text);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .swap-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-size: 14px;
            padding: 2px 6px;
            letter-spacing: 0;
            font-weight: 300;
            height: 32px;
            gap: 0;
        }
        .swap-btn span { display: block; line-height: 1; margin: -1px 0; }
        .batch-input {
            width: 56px;
            text-align: center;
            -moz-appearance: textfield;
            appearance: none;
        }
        .batch-input::-webkit-outer-spin-button,
        .batch-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .alg-toggle {
            width: 50px;
            text-align: center;
            font-weight: 600;
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .alg-toggle:hover {
            background: var(--primary);
            color: #fff;
        }
        .alg-toggle.opt {
            background: #34a853;
            border-color: #34a853;
            color: #fff;
        }
        .alg-toggle.opt:hover {
            background: #2d9248;
        }

        .canvas-wrapper {
            position: relative;
            background: #f7f8fc;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: visible;
            margin-bottom: 18px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            width: 100%;
            aspect-ratio: 16 / 10;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #f7f8fc;
            cursor: default;
            touch-action: none;
            border-radius: var(--radius);
        }

        .port-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 20;
            pointer-events: none;
        }
        .port-group.left { left: -20px; top: 50%; transform: translateY(-50%); }
        .port-group.right { right: -20px; top: 50%; transform: translateY(-50%); }
        .port {
            width: var(--port-size);
            height: var(--port-size);
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            pointer-events: auto;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: var(--text-muted);
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .port::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; opacity: 0; transition: opacity var(--transition); }
        .port:hover { transform: scale(1.18); border-color: var(--primary); box-shadow: 0 0 16px rgba(107,107,255,0.2); }
        .port.input { border-color: #b8c4d4; background: #f0f2f8; }
        .port.input:hover { border-color: var(--primary); background: #edebff; }
        .port.batch { border-color: #a0aab8; background: #f0f2f8; }
        .port.batch:hover { border-color: #8a96a6; }
        .port.output-latent { border-color: #a77bff; background: #f3edff; box-shadow: 0 0 8px rgba(167,123,255,0.15); }
        .port.output-latent:hover { border-color: #8a5cff; box-shadow: 0 0 20px rgba(167,123,255,0.3); }
        .port.output-width, .port.output-height { border-color: #5fcb8a; background: #edf9f2; box-shadow: 0 0 8px rgba(95,203,138,0.15); }
        .port.output-width:hover, .port.output-height:hover { border-color: #3dbd72; box-shadow: 0 0 20px rgba(95,203,138,0.3); }
        .port.output-batch { border-color: #a0aab8; background: #f0f2f8; }
        .port.output-batch:hover { border-color: #8a96a6; }

        .port .tooltip {
            position: absolute;
            background: rgba(26,26,46,0.88);
            color: #eee;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition), transform var(--transition);
            top: 50%;
            transform: translateY(-50%) scale(0.95);
            letter-spacing: 0.2px;
            backdrop-filter: blur(4px);
        }
        .port-group.left .tooltip { left: 22px; }
        .port-group.right .tooltip { right: 22px; }
        .port:hover .tooltip { opacity: 1; transform: translateY(-50%) scale(1); }

        .port .label-text {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1;
            letter-spacing: 0.3px;
        }
        .port.input .label-text { color: #6a7a8e; }
        .port.batch .label-text { color: #6a7a8e; }
        .port.output-latent .label-text { color: #8a5cff; }
        .port.output-width .label-text, .port.output-height .label-text { color: #3dbd72; }
        .port.output-batch .label-text { color: #6a7a8e; }

        .canvas-info-bar {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 3px;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            z-index: 10;
            min-width: 140px;
            line-height: 1.5;
        }
        .canvas-info-bar .info-row { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
        .canvas-info-bar .info-row .label { color: var(--text-muted); font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; min-width: 44px; }
        .canvas-info-bar .info-row .value { color: var(--text); font-weight: 600; font-size: 13px; }
        .canvas-info-bar .info-row .value.ratio { font-weight: 500; color: var(--primary); }
        .canvas-info-bar .info-row .value.mp { font-weight: 500; color: var(--text-secondary); }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 12px;
            background: #f7f8fc;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            transition: border var(--transition);
        }
        .control-row:hover { border-color: #c8d0dc; }
        .control-row label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            min-width: 22px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .control-row input, .control-row select {
            font-family: var(--font);
            font-size: 13px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: all var(--transition);
            flex: 1;
            min-width: 40px;
            text-align: center;
        }
        .control-row input:focus, .control-row select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(107,107,255,0.10);
        }
        .control-row input[type="number"] {
            -moz-appearance: textfield;
        }
        .control-row input[type="number"]::-webkit-outer-spin-button,
        .control-row input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .control-row .input-sm { flex: 0 0 60px; min-width: 50px; }
        .control-row .input-xs { flex: 0 0 48px; min-width: 40px; }
        .control-row .input-ratio { flex: 0 0 40px; min-width: 30px; }

        .ctrl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: var(--surface-hover);
            border-color: #b8c0cc;
            color: var(--text);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .ctrl-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .ctrl-btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
        .ctrl-btn.success { background: #34a853; border-color: #34a853; color: #fff; }
        .ctrl-btn.success:hover { background: #2d9248; border-color: #2d9248; }
        .ctrl-btn.danger { background: #ea4335; border-color: #ea4335; color: #fff; }
        .ctrl-btn.danger:hover { background: #d33426; border-color: #d33426; }
        .ctrl-btn.sm { padding: 3px 10px; font-size: 11px; }

        .preset-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        .preset-group select { flex: 2; min-width: 120px; }

        .control-row select option { text-align: center; padding: 4px 8px; transition: background 0.15s ease, color 0.15s ease; }
        .control-row select option:checked { background: var(--primary-light); color: var(--primary); }
        .control-row select option:not(:checked):hover { background: #eef0f8; }
        .control-row select option.divider, #presetSelect option.divider {
            color: transparent;
            font-weight: 300;
            background: transparent;
            padding: 0;
            height: 12px;
            line-height: 12px;
            font-size: 0px;
            letter-spacing: 0;
            pointer-events: none;
            border: none;
            min-height: 12px;
            background-image: linear-gradient(to right, transparent 0%, #b8c4d4 15%, #b8c4d4 85%, transparent 100%);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 2px;
        }
        .control-row select option.divider::before, #presetSelect option.divider::before { content: ''; display: block; height: 1px; background: transparent; }
        .control-row select { transition: border var(--transition), box-shadow var(--transition); cursor: pointer; }
        #presetSelect { text-align: center; transition: border var(--transition), box-shadow var(--transition); }

        @media (max-width: 750px) {
            .app { padding: 16px 14px; }
            .app-title { font-size: 17px; }
            .top-actions { gap: 4px; }
            .top-actions select, .top-actions input { font-size: 12px; padding: 4px 8px; min-width: 50px; }
            .canvas-info-bar { bottom: 12px; left: 12px; padding: 6px 10px; font-size: 11px; min-width: 120px; }
            .canvas-info-bar .info-row .label { font-size: 9px; min-width: 32px; }
            .canvas-info-bar .info-row .value { font-size: 11px; }
            .port-group.left { left: -14px; }
            .port-group.right { right: -14px; }
            .port { width: 13px; height: 13px; }
            .port .tooltip { display: none; }
            .control-row { padding: 6px 8px; gap: 4px; }
            .control-row input, .control-row select { font-size: 12px; padding: 3px 6px; }
            .control-row .input-sm { flex: 0 0 50px; min-width: 40px; }
            .control-row .input-xs { flex: 0 0 40px; min-width: 32px; }
            .control-row .input-ratio { flex: 0 0 32px; min-width: 24px; }
            .ctrl-btn.sm { padding: 2px 8px; font-size: 10px; }
            .preset-group select { min-width: 80px; }
            .batch-input { width: 44px; }
            .alg-toggle { width: 40px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .app { padding: 12px 10px; }
            .app-header { flex-direction: column; align-items: stretch; gap: 8px; }
            .top-actions { justify-content: flex-start; }
            .canvas-info-bar { bottom: 8px; left: 8px; padding: 4px 8px; font-size: 10px; min-width: 100px; }
            .canvas-info-bar .info-row .label { font-size: 8px; min-width: 28px; }
            .canvas-info-bar .info-row .value { font-size: 10px; }
            .control-row { flex-wrap: wrap; }
            .control-row label { min-width: 16px; font-size: 10px; }
            .port-group.left, .port-group.right { display: none; }
            .batch-input { width: 40px; }
            .alg-toggle { width: 36px; font-size: 11px; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #e8eaef; }
        ::-webkit-scrollbar-thumb { background: #c8d0dc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0b8c4; }
    </style>
</head>
<body>
    <div class="app" id="app">

        <header class="app-header">
            <div class="app-title">
                <span>🎯 分辨率选择器</span>
                <span class="badge">独立预设</span>
            </div>
            <div class="top-actions">
                <label>最大限制</label>
                <select id="limitSelect">
                    <option value="1024">1024</option>
                    <option value="2048">2048</option>
                    <option value="4096" selected>4096</option>
                    <option value="8192">8192</option>
                    <option value="custom">自定义</option>
                </select>
                <input type="number" id="limitCustomInput" class="limit-custom-input" placeholder="边" value="4096" style="display:none;" />
                <button class="top-btn swap-btn" id="swapBtn" title="交换宽高并应用步数"><span>←</span><span>→</span></button>
                <input type="text" id="batchStep" class="batch-input" value="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" title="批次数量（影响 Latent 的 N 维度）" />
                <button class="top-btn alg-toggle" id="algToggle" title="切换算法：标=标准四舍五入，优=优化比例优先">优</button>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="500"></canvas>
            <div class="port-group left">
                <div class="port input" id="portW" title="点击设置宽度"><span class="label-text">W</span><span class="tooltip">宽度</span></div>
                <div class="port input" id="portH" title="点击设置高度"><span class="label-text">H</span><span class="tooltip">高度</span></div>
                <div class="port batch" id="portBatchIn" title="点击设置批次数量"><span class="label-text">B</span><span class="tooltip">批次数量</span></div>
            </div>
            <div class="port-group right">
                <div class="port output-latent" id="portLatent" title="点击复制 latent 形状"><span class="label-text">L</span><span class="tooltip" id="latentTooltip">latent (1,4,1024,1024)</span></div>
                <div class="port output-width" id="portOutW" title="点击复制宽度"><span class="label-text">W</span><span class="tooltip">宽度</span></div>
                <div class="port output-height" id="portOutH" title="点击复制高度"><span class="label-text">H</span><span class="tooltip">高度</span></div>
                <div class="port output-batch" id="portBatchOut" title="点击复制批次数量"><span class="label-text">B</span><span class="tooltip">批次数量</span></div>
            </div>
            <div class="canvas-info-bar" id="canvasInfo">
                <div class="info-row"><span class="label">尺寸</span><span class="value" id="infoW">1024</span><span style="color:var(--text-muted);font-weight:300;">×</span><span class="value" id="infoH">1024</span></div>
                <div class="info-row"><span class="label">比例</span><span class="value ratio" id="infoRatio">1:1</span></div>
                <div class="info-row"><span class="label">实际MP</span><span class="value mp" id="infoMP">1.00</span></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-row">
                <label>宽</label>
                <input type="number" id="widthInput" value="1024" min="1" step="1" />
                <label>高</label>
                <input type="number" id="heightInput" value="1024" min="1" step="1" />
                <label style="min-width:20px;">对齐</label>
                <input type="number" id="alignMultiple" value="8" min="1" step="1" class="input-xs" />
                <label>MP</label>
                <input type="number" id="megapixelsInput" value="1.0" min="0.01" step="any" class="input-sm" />
                <label style="min-width:20px;">比例</label>
                <select id="aspectSelect" style="flex:1;min-width:80px;"></select>
                <span style="font-size:12px;color:var(--text-muted);font-weight:500;">自定义</span>
                <input type="text" id="customRatioW" placeholder="宽" value="1" class="input-ratio" />
                <span style="color:var(--text-muted);">:</span>
                <input type="text" id="customRatioH" placeholder="高" value="1" class="input-ratio" />
                <button class="ctrl-btn success sm" id="saveCustomRatioBtn">保存</button>
                <button class="ctrl-btn danger sm" id="deleteCustomRatioBtn">删除</button>
            </div>
            <div class="control-row">
                <div class="preset-group">
                    <select id="presetSelect"></select>
                    <button class="ctrl-btn success sm" id="savePresetBtn">保存</button>
                    <button class="ctrl-btn danger sm" id="deletePresetBtn">删除</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  独立预设版 · 最终稳定版本
        // ================================================================

        // -------- DOM --------
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const alignMultiple = document.getElementById('alignMultiple');
        const swapBtn = document.getElementById('swapBtn');
        const batchStep = document.getElementById('batchStep');
        const algToggle = document.getElementById('algToggle');

        const limitSelect = document.getElementById('limitSelect');
        const limitCustomInput = document.getElementById('limitCustomInput');

        const presetSelect = document.getElementById('presetSelect');
        const savePresetBtn = document.getElementById('savePresetBtn');
        const deletePresetBtn = document.getElementById('deletePresetBtn');

        const megapixelsInput = document.getElementById('megapixelsInput');
        const aspectSelect = document.getElementById('aspectSelect');
        const customRatioW = document.getElementById('customRatioW');
        const customRatioH = document.getElementById('customRatioH');
        const saveCustomRatioBtn = document.getElementById('saveCustomRatioBtn');
        const deleteCustomRatioBtn = document.getElementById('deleteCustomRatioBtn');

        const infoW = document.getElementById('infoW');
        const infoH = document.getElementById('infoH');
        const infoRatio = document.getElementById('infoRatio');
        const infoMP = document.getElementById('infoMP');

        const portW = document.getElementById('portW');
        const portH = document.getElementById('portH');
        const portBatchIn = document.getElementById('portBatchIn');
        const portLatent = document.getElementById('portLatent');
        const latentTooltip = document.getElementById('latentTooltip');
        const portOutW = document.getElementById('portOutW');
        const portOutH = document.getElementById('portOutH');
        const portBatchOut = document.getElementById('portBatchOut');

        // -------- 状态 --------
        const state = {
            width: 1024,
            height: 1024,
            limit: 4096,
            align: 8,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            startWidth: 0,
            startHeight: 0,
            ctrlDown: false,
            shiftDown: false,
            canvasW: 800,
            canvasH: 500,
            rect: { x: 0, y: 0, w: 0, h: 0 },
            handlePos: { x: 0, y: 0, radius: 14 },
            scaleToCanvas: 1,
            updating: false,
            dragOriginW: 0,
            dragOriginH: 0,
            dragOriginX: 0,
            dragOriginY: 0,
            selectedPresetName: null,
            selectedRatioLabel: '1:1',
            useOptimized: true,
            rawWidth: 1024,
            rawHeight: 1024,
            batchSize: 1,
            latentChannels: 4,
        };

        // -------- 存储 Keys --------
        const PRESET_KEY = 'res_picker_presets_node_v30';
        const CUSTOM_RATIO_KEY = 'res_picker_custom_ratios_node_v30';

        // -------- 比例列表 --------
        const FIXED_RATIOS_ORDERED = [
            '1:1', '2:3', '3:2', '3:4', '4:3', '4:5', '5:4',
            '9:16', '9:21', '10:16', '16:9', '16:10', '21:9', '2.35:1'
        ];
        const RATIO_DESC = {
            '1:1': '方形',
            '4:5': '竖4:5',
            '5:4': '横5:4',
            '3:4': '竖3:4',
            '4:3': '横4:3',
            '2:3': '竖2:3',
            '3:2': '横3:2',
            '16:9': '宽屏',
            '9:16': '竖屏',
            '16:10': '宽屏10',
            '10:16': '竖10:16',
            '21:9': '超宽',
            '9:21': '竖9:21',
            '2.35:1': '电影宽银幕'
        };

        const RESOLUTION_PRESETS = [
            { name: '720p HD - 1280x720 - (16:9)', width: 1280, height: 720 },
            { name: '1080p Full HD - 1920x1080 - (16:9)', width: 1920, height: 1080 },
            { name: '1440p 2K - 2560x1440 - (16:9)', width: 2560, height: 1440 },
            { name: '4K UHD - 3840x2160 - (16:9)', width: 3840, height: 2160 },
            { name: '8K UHD - 7680x4320 - (16:9)', width: 7680, height: 4320 },
            { name: 'Cinema 2.35:1 - 1920x817 - (2.35:1)', width: 1920, height: 817 },
            { name: 'Cinema 4K - 4096x1744 - (2.35:1)', width: 4096, height: 1744 },
            { name: 'Portrait 9:16 - 1080x1920 - (9:16)', width: 1080, height: 1920 }
        ];

        // -------- 工具函数 --------
        function gcd(a, b) { a = Math.round(a); b = Math.round(b); while (b) { let t = b; b = a % b; a = t; } return a; }
        function calcAspectRatio(w, h) {
            const g = gcd(w, h);
            const wr = w / g, hr = h / g;
            if (wr <= 30 && hr <= 30) return `${Math.round(wr)}:${Math.round(hr)}`;
            return (w / h).toFixed(3) + ':1';
        }

        // -------- 算法 --------
        function computeStandard(mp, ratioStr, mult) {
            const parts = ratioStr.split(/[:/]/).map(Number);
            if (parts.length !== 2 || parts.some(isNaN)) return null;
            const wRatio = parts[0], hRatio = parts[1];
            const totalPixels = mp * 1024 * 1024;
            const aspect = wRatio / hRatio;
            let theoW = Math.sqrt(totalPixels * aspect);
            let theoH = Math.sqrt(totalPixels / aspect);
            const w = Math.max(1, Math.round(theoW / mult) * mult);
            const h = Math.max(1, Math.round(theoH / mult) * mult);
            return { w, h };
        }

        function computeOptimized(mp, ratioStr, mult) {
            const parts = ratioStr.split(/[:/]/).map(Number);
            if (parts.length !== 2 || parts.some(isNaN)) return null;
            const wRatio = parts[0], hRatio = parts[1];
            const targetPixels = mp * 1024 * 1024;
            const targetRatio = wRatio / hRatio;

            let theoW = Math.sqrt(targetPixels * targetRatio);
            let theoH = Math.sqrt(targetPixels / targetRatio);

            const range = Math.max(mult * 3, 64);
            const wStart = Math.max(1, Math.floor((theoW - range) / mult) * mult);
            const wEnd = Math.floor((theoW + range) / mult) * mult;
            const hStart = Math.max(1, Math.floor((theoH - range) / mult) * mult);
            const hEnd = Math.floor((theoH + range) / mult) * mult;

            let bestW = 1, bestH = 1, bestLoss = Infinity;
            for (let w = wStart; w <= wEnd; w += mult) {
                for (let h = hStart; h <= hEnd; h += mult) {
                    const pixels = w * h;
                    const ratio = w / h;
                    const loss = Math.abs(pixels - targetPixels) / targetPixels +
                                 Math.abs(ratio - targetRatio) / targetRatio;
                    if (loss < bestLoss) {
                        bestLoss = loss;
                        bestW = w;
                        bestH = h;
                    }
                }
            }
            if (bestW === 1 && bestH === 1) {
                return computeStandard(mp, ratioStr, mult);
            }
            return { w: bestW, h: bestH };
        }

        function computeResolution(mp, ratioStr, mult) {
            return state.useOptimized ? computeOptimized(mp, ratioStr, mult) : computeStandard(mp, ratioStr, mult);
        }

        // -------- 更新 Latent Tooltip --------
        function updateLatentDisplay() {
            const shape = `(${state.batchSize}, ${state.latentChannels}, ${state.height}, ${state.width})`;
            if (latentTooltip) {
                latentTooltip.textContent = `latent ${shape}`;
            }
        }

        // -------- 加载/保存 --------
        function loadPresets() {
            try { const raw = localStorage.getItem(PRESET_KEY); if (raw) { const data = JSON.parse(raw); if (Array.isArray(data)) return data; } } catch (_) {}
            return [];
        }
        function savePresets(p) { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); }
        function loadCustomRatios() {
            try { const raw = localStorage.getItem(CUSTOM_RATIO_KEY); if (raw) { const data = JSON.parse(raw); if (Array.isArray(data)) return data; } } catch (_) {}
            return [];
        }
        function saveCustomRatios(r) { localStorage.setItem(CUSTOM_RATIO_KEY, JSON.stringify(r)); }

        // -------- 初始化预设 --------
        let presets = loadPresets();
        if (presets.length === 0) {
            const mult = 8, mp = 1.0;
            const ratioPresets = FIXED_RATIOS_ORDERED.map(ratio => {
                const r = computeStandard(mp, ratio, mult);
                if (r) {
                    const desc = RATIO_DESC[ratio] || ratio;
                    return { name: `${desc} - ${r.w}x${r.h} - (${ratio})`, width: r.w, height: r.h };
                }
                return null;
            }).filter(Boolean);
            presets = ratioPresets.concat(RESOLUTION_PRESETS);
            savePresets(presets);
        }
        let customRatios = loadCustomRatios().filter(r => r !== '2:1' && !FIXED_RATIOS_ORDERED.includes(r));
        saveCustomRatios(customRatios);

        // -------- 渲染 UI --------
        function renderAspectSelect() {
            const sel = aspectSelect;
            const currentValue = sel.value;
            sel.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '';
            emptyOpt.style.textAlign = 'center';
            sel.appendChild(emptyOpt);

            FIXED_RATIOS_ORDERED.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                opt.style.textAlign = 'center';
                sel.appendChild(opt);
            });
            if (customRatios.length > 0) {
                const div = document.createElement('option');
                div.disabled = true;
                div.textContent = '';
                div.className = 'divider';
                div.style.textAlign = 'center';
                sel.appendChild(div);
                customRatios.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    opt.textContent = r;
                    opt.style.textAlign = 'center';
                    sel.appendChild(opt);
                });
            }
            // 恢复选中
            if (state.selectedRatioLabel && [...sel.options].some(o => o.value === state.selectedRatioLabel)) {
                sel.value = state.selectedRatioLabel;
            } else {
                sel.value = FIXED_RATIOS_ORDERED[0] || '';
                state.selectedRatioLabel = sel.value;
            }
        }

        function renderPresetSelect() {
            const current = presetSelect.value;
            presetSelect.innerHTML = '';
            if (presets.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— 无预设 —';
                opt.style.textAlign = 'center';
                presetSelect.appendChild(opt);
                state.selectedPresetName = null;
                return;
            }

            const ratioCount = FIXED_RATIOS_ORDERED.length;
            const ratioPresets = presets.slice(0, ratioCount);
            const resolutionPresets = presets.slice(ratioCount);

            ratioPresets.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name;
                opt.style.textAlign = 'center';
                presetSelect.appendChild(opt);
            });
            if (resolutionPresets.length > 0) {
                const div = document.createElement('option');
                div.disabled = true;
                div.textContent = '';
                div.className = 'divider';
                div.style.textAlign = 'center';
                presetSelect.appendChild(div);
                resolutionPresets.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.name;
                    opt.style.textAlign = 'center';
                    presetSelect.appendChild(opt);
                });
            }

            // 恢复选中的预设
            if (state.selectedPresetName && presets.some(p => p.name === state.selectedPresetName)) {
                presetSelect.value = state.selectedPresetName;
            } else {
                presetSelect.value = '';
                state.selectedPresetName = null;
            }
        }

        function getCurrentPreset() {
            const name = presetSelect.value;
            return presets.find(p => p.name === name) || null;
        }

        // -------- 应用最佳限制（基于理论宽高） --------
        function applyBestLimit(theoryW, theoryH) {
            const maxDim = Math.max(theoryW, theoryH);
            const limits = [1024, 2048, 4096, 8192];
            let best = null;
            for (let lim of limits) {
                if (lim >= maxDim) {
                    best = lim;
                    break;
                }
            }
            if (best === null) {
                best = maxDim;
                limitSelect.value = 'custom';
                limitCustomInput.style.display = 'inline-block';
                limitCustomInput.value = best;
            } else {
                limitSelect.value = best.toString();
                limitCustomInput.style.display = 'none';
            }
            state.limit = best;
        }

        // -------- 应用对齐和限制 --------
        function applyAlignmentAndLimit(w, h) {
            const mult = parseInt(alignMultiple.value) || 8;
            let clampedW = Math.max(1, Math.round(w / mult) * mult);
            let clampedH = Math.max(1, Math.round(h / mult) * mult);
            const limit = state.limit;
            if (clampedW > limit || clampedH > limit) {
                const s = Math.min(limit / clampedW, limit / clampedH);
                clampedW = Math.round(clampedW * s);
                clampedH = Math.round(clampedH * s);
                clampedW = Math.max(1, Math.round(clampedW / mult) * mult);
                clampedH = Math.max(1, Math.round(clampedH / mult) * mult);
                if (clampedW > limit) {
                    clampedW = limit;
                    clampedH = Math.round(limit * (h / w) / mult) * mult;
                }
                if (clampedH > limit) {
                    clampedH = limit;
                    clampedW = Math.round(limit * (w / h) / mult) * mult;
                }
                clampedW = Math.max(1, Math.round(clampedW / mult) * mult);
                clampedH = Math.max(1, Math.round(clampedH / mult) * mult);
            }
            return { w: Math.max(1, Math.min(limit, clampedW)), h: Math.max(1, Math.min(limit, clampedH)) };
        }

        // -------- 核心：更新所有显示 --------
        function updateAllDisplay() {
            infoW.textContent = state.width;
            infoH.textContent = state.height;
            const mp = (state.width * state.height) / (1024 * 1024);
            infoMP.textContent = mp.toFixed(2);

            const ratioStr = calcAspectRatio(state.width, state.height);
            infoRatio.textContent = ratioStr;

            widthInput.value = state.width;
            heightInput.value = state.height;

            renderPresetSelect();
            updateLatentDisplay();
            drawCanvas();
        }

        // -------- 应用预设（独立加载） --------
        function applyPreset(name) {
            const p = presets.find(pr => pr.name === name);
            if (!p) {
                state.selectedPresetName = null;
                renderPresetSelect();
                return;
            }
            state.selectedPresetName = p.name;
            // 直接使用预设的宽高，应用限制
            applyBestLimit(p.width, p.height);
            const aligned = applyAlignmentAndLimit(p.width, p.height);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
            drawCanvas();
        }

        // -------- 应用比例（独立计算） --------
        function applyRatio(ratio) {
            if (!ratio) {
                state.selectedRatioLabel = '';
                return;
            }
            state.selectedRatioLabel = ratio;
            const mp = parseFloat(megapixelsInput.value);
            if (isNaN(mp) || mp < 0.01) return;
            const mult = parseInt(alignMultiple.value) || 8;
            const result = computeResolution(mp, ratio, mult);
            if (!result) return;

            const theory = computeResolution(mp, ratio, 1);
            if (theory) applyBestLimit(theory.w, theory.h);

            const aligned = applyAlignmentAndLimit(result.w, result.h);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
        }

        // -------- 比例预设下拉 --------
        aspectSelect.addEventListener('change', function() {
            applyRatio(this.value);
        });
        // 点击 option 如果与当前选中相同也重新加载
        aspectSelect.addEventListener('click', function(e) {
            if (e.target.tagName === 'OPTION') {
                if (e.target.value === this.value) {
                    applyRatio(e.target.value);
                }
            }
        });

        // -------- 宽高预设下拉 --------
        presetSelect.addEventListener('change', function() {
            applyPreset(this.value);
        });
        presetSelect.addEventListener('click', function(e) {
            if (e.target.tagName === 'OPTION') {
                if (e.target.value === this.value) {
                    applyPreset(e.target.value);
                }
            }
        });

        // -------- MP 输入变化（自动计算） --------
        megapixelsInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); autoComputeFromMP(); }
        });
        megapixelsInput.addEventListener('change', function() { autoComputeFromMP(); });

        function autoComputeFromMP() {
            const mp = parseFloat(megapixelsInput.value);
            if (isNaN(mp) || mp < 0.01) return;
            let ratioStr = aspectSelect.value;
            if (!ratioStr) ratioStr = FIXED_RATIOS_ORDERED[0] || '1:1';
            state.selectedRatioLabel = ratioStr;

            const mult = parseInt(alignMultiple.value) || 8;
            const result = computeResolution(mp, ratioStr, mult);
            if (!result) return;

            const theory = computeResolution(mp, ratioStr, 1);
            if (theory) applyBestLimit(theory.w, theory.h);

            const aligned = applyAlignmentAndLimit(result.w, result.h);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
        }

        // -------- 手动输入宽高 --------
        widthInput.addEventListener('keydown', handleEnterOnWH);
        heightInput.addEventListener('keydown', handleEnterOnWH);
        widthInput.addEventListener('change', handleChangeWH);
        heightInput.addEventListener('change', handleChangeWH);

        function handleEnterOnWH(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const w = parseInt(widthInput.value);
                const h = parseInt(heightInput.value);
                if (!isNaN(w) && !isNaN(h) && w >= 1 && h >= 1) {
                    applyBestLimit(w, h);
                    const aligned = applyAlignmentAndLimit(w, h);
                    state.width = aligned.w;
                    state.height = aligned.h;
                    state.rawWidth = aligned.w;
                    state.rawHeight = aligned.h;
                    updateAllDisplay();
                } else {
                    widthInput.value = state.width;
                    heightInput.value = state.height;
                }
            }
        }
        function handleChangeWH() {
            const w = parseInt(widthInput.value);
            const h = parseInt(heightInput.value);
            if (!isNaN(w) && !isNaN(h) && w >= 1 && h >= 1) {
                applyBestLimit(w, h);
                const aligned = applyAlignmentAndLimit(w, h);
                state.width = aligned.w;
                state.height = aligned.h;
                state.rawWidth = aligned.w;
                state.rawHeight = aligned.h;
                updateAllDisplay();
            } else {
                widthInput.value = state.width;
                heightInput.value = state.height;
            }
        }

        // -------- 交换宽高 --------
        swapBtn.addEventListener('click', function() {
            let step = parseInt(batchStep.value);
            if (isNaN(step) || step < 1) step = 1;
            let newW = state.height + step;
            let newH = state.width - step;
            newW = Math.max(1, newW);
            newH = Math.max(1, newH);
            applyBestLimit(newW, newH);
            const aligned = applyAlignmentAndLimit(newW, newH);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
            drawCanvas();
        });

        // -------- 对齐倍数变化 --------
        alignMultiple.addEventListener('change', function() {
            const aligned = applyAlignmentAndLimit(state.width, state.height);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
        });

        // -------- 算法切换 --------
        algToggle.addEventListener('click', function() {
            state.useOptimized = !state.useOptimized;
            this.textContent = state.useOptimized ? '优' : '标';
            this.classList.toggle('opt', state.useOptimized);
            autoComputeFromMP();
        });

        // -------- 批次数量 --------
        batchStep.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value === '') this.value = '1';
            const num = parseInt(this.value);
            if (isNaN(num) || num < 1) this.value = '1';
            state.batchSize = parseInt(this.value) || 1;
            updateLatentDisplay();
        });

        // -------- 限制处理 --------
        function handleLimitChange() {
            let newLimit;
            if (limitSelect.value === 'custom') {
                limitCustomInput.style.display = 'inline-block';
                newLimit = parseInt(limitCustomInput.value) || 1024;
            } else {
                limitCustomInput.style.display = 'none';
                newLimit = parseInt(limitSelect.value) || 1024;
            }
            newLimit = Math.max(1, newLimit);
            state.limit = newLimit;
            const aligned = applyAlignmentAndLimit(state.width, state.height);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
            drawCanvas();
        }
        limitSelect.addEventListener('change', handleLimitChange);
        limitCustomInput.addEventListener('input', function() {
            const v = parseInt(this.value) || 1024;
            state.limit = Math.max(1, v);
            const aligned = applyAlignmentAndLimit(state.width, state.height);
            state.width = aligned.w;
            state.height = aligned.h;
            state.rawWidth = aligned.w;
            state.rawHeight = aligned.h;
            updateAllDisplay();
            drawCanvas();
        });

        // -------- 自定义比例 --------
        saveCustomRatioBtn.addEventListener('click', function() {
            const w = customRatioW.value.trim(), h = customRatioH.value.trim();
            if (!w || !h) { alert('请输入宽和高的数值'); return; }
            const ratio = `${w}:${h}`;
            if (!customRatios.includes(ratio) && !FIXED_RATIOS_ORDERED.includes(ratio)) {
                customRatios.push(ratio);
                saveCustomRatios(customRatios);
                renderAspectSelect();
                aspectSelect.value = ratio;
                state.selectedRatioLabel = ratio;
                autoComputeFromMP();
            } else {
                alert('该比例已存在或为固定比例');
            }
        });
        deleteCustomRatioBtn.addEventListener('click', function() {
            const selected = aspectSelect.value;
            if (!selected) return;
            if (customRatios.includes(selected)) {
                if (!confirm(`删除自定义比例 "${selected}" ？`)) return;
                customRatios = customRatios.filter(r => r !== selected);
                saveCustomRatios(customRatios);
                renderAspectSelect();
                aspectSelect.value = FIXED_RATIOS_ORDERED[0] || '';
                state.selectedRatioLabel = aspectSelect.value;
                autoComputeFromMP();
            } else {
                alert('只能删除自定义比例');
            }
        });

        // -------- 预设操作 --------
        savePresetBtn.addEventListener('click', function() {
            const ratio = calcAspectRatio(state.width, state.height);
            const desc = RATIO_DESC[ratio] || '自定义';
            const defaultName = `${desc} - ${state.width}x${state.height} - (${ratio})`;
            const name = prompt('请输入预设名称 (格式: 描述 - 宽x高 - (宽:高))：', defaultName);
            if (!name || name.trim() === '') return;
            const trimmed = name.trim();
            const existing = presets.find(p => p.name === trimmed);
            if (existing) {
                if (!confirm(`预设 "${trimmed}" 已存在，覆盖？`)) return;
                existing.width = state.width;
                existing.height = state.height;
            } else {
                presets.push({ name: trimmed, width: state.width, height: state.height });
            }
            savePresets(presets);
            state.selectedPresetName = trimmed;
            renderPresetSelect();
            presetSelect.value = trimmed;
        });
        deletePresetBtn.addEventListener('click', function() {
            const p = getCurrentPreset();
            if (!p) { alert('请先选择一个预设'); return; }
            if (!confirm(`删除预设 "${p.name}" ？`)) return;
            if (state.selectedPresetName === p.name) { state.selectedPresetName = null; }
            presets = presets.filter(pr => pr.name !== p.name);
            savePresets(presets);
            renderPresetSelect();
        });

        // -------- 端口点击 --------
        portW.addEventListener('click', function() {
            const newVal = prompt('输入宽度：', state.width);
            if (newVal !== null) {
                const w = parseInt(newVal);
                if (!isNaN(w) && w >= 1) {
                    applyBestLimit(w, state.height);
                    const aligned = applyAlignmentAndLimit(w, state.height);
                    state.width = aligned.w;
                    state.height = aligned.h;
                    state.rawWidth = aligned.w;
                    state.rawHeight = aligned.h;
                    updateAllDisplay();
                    drawCanvas();
                }
            }
        });
        portH.addEventListener('click', function() {
            const newVal = prompt('输入高度：', state.height);
            if (newVal !== null) {
                const h = parseInt(newVal);
                if (!isNaN(h) && h >= 1) {
                    applyBestLimit(state.width, h);
                    const aligned = applyAlignmentAndLimit(state.width, h);
                    state.width = aligned.w;
                    state.height = aligned.h;
                    state.rawWidth = aligned.w;
                    state.rawHeight = aligned.h;
                    updateAllDisplay();
                    drawCanvas();
                }
            }
        });
        portBatchIn.addEventListener('click', function() {
            const val = prompt('输入批次数量：', batchStep.value);
            if (val !== null) {
                const num = parseInt(val);
                if (!isNaN(num) && num >= 1) {
                    batchStep.value = num;
                    state.batchSize = num;
                    updateLatentDisplay();
                } else { alert('请输入正整数'); }
            }
        });
        portLatent.addEventListener('click', function() {
            const shape = `(${state.batchSize}, ${state.latentChannels}, ${state.height}, ${state.width})`;
            navigator.clipboard.writeText(shape).then(() => {
                portLatent.style.borderColor = '#88ff88';
                setTimeout(() => portLatent.style.borderColor = '', 300);
            }).catch(() => {});
        });
        portOutW.addEventListener('click', function() {
            navigator.clipboard.writeText(state.width.toString()).then(() => {
                portOutW.style.borderColor = '#88ff88';
                setTimeout(() => portOutW.style.borderColor = '', 300);
            });
        });
        portOutH.addEventListener('click', function() {
            navigator.clipboard.writeText(state.height.toString()).then(() => {
                portOutH.style.borderColor = '#88ff88';
                setTimeout(() => portOutH.style.borderColor = '', 300);
            });
        });
        portBatchOut.addEventListener('click', function() {
            navigator.clipboard.writeText(batchStep.value).then(() => {
                portBatchOut.style.borderColor = '#88ff88';
                setTimeout(() => portBatchOut.style.borderColor = '', 300);
            });
        });

        // -------- 画布绘制 --------
        function drawCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            let cssW = canvas.clientWidth || rect.width || 800;
            let cssH = canvas.clientHeight || rect.height || 500;
            if (cssW < 100) cssW = 800;
            if (cssH < 100) cssH = 500;

            if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
                state.canvasW = canvas.width;
                state.canvasH = canvas.height;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            const cw = canvas.width / dpr;
            const ch = canvas.height / dpr;
            ctx.clearRect(0, 0, cw, ch);
            ctx.fillStyle = '#f7f8fc';
            ctx.fillRect(0, 0, cw, ch);

            const limit = state.limit;
            if (limit < 64) {
                state.limit = 1024;
                applyBestLimit(1024, 1024);
            }
            const pad = 48;
            const availW = cw - pad * 2;
            const availH = ch - pad * 2;
            const scaleX = availW / limit;
            const scaleY = availH / limit;
            const scale = Math.min(scaleX, scaleY, 1.5);
            state.scaleToCanvas = scale;

            const mult = parseInt(alignMultiple.value) || 8;
            const gridStepPx = mult * scale;
            const startX = pad + (cw - pad * 2 - limit * scale) / 2;
            const startY = pad + (ch - pad * 2 - limit * scale) / 2;

            if (gridStepPx >= 4) {
                ctx.strokeStyle = '#e2e6ee';
                ctx.lineWidth = 0.5;
                for (let v = 0; v <= limit; v += mult) {
                    const px = startX + v * scale;
                    const py = startY + v * scale;
                    if (px <= cw - pad) {
                        ctx.beginPath();
                        ctx.moveTo(px, startY);
                        ctx.lineTo(px, startY + limit * scale);
                        ctx.stroke();
                    }
                    if (py <= ch - pad) {
                        ctx.beginPath();
                        ctx.moveTo(startX, py);
                        ctx.lineTo(startX + limit * scale, py);
                        ctx.stroke();
                    }
                }
                ctx.strokeStyle = '#d0d5dd';
                ctx.lineWidth = 0.8;
                const zeroX = startX;
                const zeroY = startY + limit * scale;
                ctx.beginPath();
                ctx.moveTo(zeroX, startY);
                ctx.lineTo(zeroX, startY + limit * scale);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(startX, startY + limit * scale);
                ctx.lineTo(startX + limit * scale, startY + limit * scale);
                ctx.stroke();
            }

            const rectW = state.width * scale;
            const rectH = state.height * scale;
            const totalW = limit * scale;
            const totalH = limit * scale;
            const offsetX = (cw - totalW) / 2;
            const offsetY = (ch - totalH) / 2;
            const rx = offsetX + (limit - state.width) / 2 * scale;
            const ry = offsetY + (limit - state.height) / 2 * scale;

            state.rect = { x: rx, y: ry, w: rectW, h: rectH };

            ctx.fillStyle = 'rgba(107,107,255,0.06)';
            ctx.shadowColor = 'rgba(107,107,255,0.08)';
            ctx.shadowBlur = 20;
            ctx.fillRect(rx, ry, rectW, rectH);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#6b6bff';
            ctx.lineWidth = 2;
            ctx.strokeRect(rx, ry, rectW, rectH);
            ctx.strokeStyle = 'rgba(107,107,255,0.15)';
            ctx.lineWidth = 4;
            ctx.strokeRect(rx - 1, ry - 1, rectW + 2, rectH + 2);

            const handleSize = 16;
            const hx = rx + rectW;
            const hy = ry + rectH;

            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.shadowColor = 'rgba(0,0,0,0.06)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(hx, hy, handleSize / 2 + 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#6b6bff';
            ctx.beginPath();
            ctx.arc(hx, hy, handleSize / 2 - 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(hx - 4, hy + 2);
            ctx.lineTo(hx + 2, hy - 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(hx - 1, hy + 2);
            ctx.lineTo(hx + 2, hy - 1);
            ctx.stroke();

            state.handlePos = { x: hx, y: hy, radius: handleSize / 2 + 6 };

            ctx.fillStyle = 'rgba(26,32,44,0.45)';
            ctx.font = '11px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(`${state.width} px`, rx + rectW / 2, ry + rectH + 18);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${state.height} px`, rx + rectW + 10, ry + rectH / 2);

            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(26,32,44,0.20)';
            ctx.font = '10px Inter, sans-serif';
            ctx.fillText(`限制 ${limit}×${limit}`, cw - 14, 12);
        }

        // -------- 拖拽逻辑（无反转） --------
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const scaleX = (canvas.width / dpr) / rect.width;
            const scaleY = (canvas.height / dpr) / rect.height;
            const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
            const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function isOnHandle(cx, cy) {
            const hp = state.handlePos;
            if (!hp) return false;
            const dx = cx - hp.x, dy = cy - hp.y;
            return (dx*dx + dy*dy) <= (hp.radius * hp.radius);
        }

        function onPointerDown(e) {
            e.preventDefault();
            const coord = getCanvasCoords(e);
            if (isOnHandle(coord.x, coord.y)) {
                state.isDragging = true;
                state.dragStartX = coord.x;
                state.dragStartY = coord.y;
                state.dragOriginW = state.width;
                state.dragOriginH = state.height;
                state.dragOriginX = coord.x;
                state.dragOriginY = coord.y;
                canvas.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(e) {
            e.preventDefault();
            const coord = getCanvasCoords(e);
            if (e.ctrlKey !== undefined) {
                state.ctrlDown = e.ctrlKey || e.metaKey;
                state.shiftDown = e.shiftKey;
            }
            if (state.isDragging) {
                const dx = coord.x - state.dragStartX;
                const dy = coord.y - state.dragStartY;
                const scale = state.scaleToCanvas;
                let deltaW = dx / scale;
                let deltaH = dy / scale;
                if (state.shiftDown) {
                    const aspect = state.dragOriginW / state.dragOriginH;
                    const absDx = Math.abs(deltaW);
                    const absDy = Math.abs(deltaH);
                    if (absDx > absDy * aspect) {
                        deltaH = deltaW / aspect;
                    } else {
                        deltaW = deltaH * aspect;
                    }
                }
                let newW = state.dragOriginW + deltaW;
                let newH = state.dragOriginH + deltaH;
                if (!state.ctrlDown) {
                    const mult = parseInt(alignMultiple.value) || 8;
                    newW = Math.round(newW / mult) * mult;
                    newH = Math.round(newH / mult) * mult;
                } else {
                    newW = Math.round(newW);
                    newH = Math.round(newH);
                }
                newW = Math.max(1, newW);
                newH = Math.max(1, newH);
                const limit = state.limit;
                if (newW > limit) {
                    newW = limit;
                    if (state.shiftDown) {
                        newH = Math.round(newW / (state.dragOriginW / state.dragOriginH));
                    }
                }
                if (newH > limit) {
                    newH = limit;
                    if (state.shiftDown) {
                        newW = Math.round(newH * (state.dragOriginW / state.dragOriginH));
                    }
                }
                if (!state.ctrlDown) {
                    const mult = parseInt(alignMultiple.value) || 8;
                    newW = Math.round(newW / mult) * mult;
                    newH = Math.round(newH / mult) * mult;
                }
                newW = Math.max(1, newW);
                newH = Math.max(1, newH);
                state.width = newW;
                state.height = newH;
                state.rawWidth = newW;
                state.rawHeight = newH;
                updateAllDisplay();
            } else {
                canvas.style.cursor = isOnHandle(coord.x, coord.y) ? 'nwse-resize' : 'default';
            }
        }

        function onPointerUp(e) {
            if (state.isDragging) {
                state.isDragging = false;
                canvas.style.cursor = 'default';
                const mult = parseInt(alignMultiple.value) || 8;
                let w = Math.round(state.width / mult) * mult;
                let h = Math.round(state.height / mult) * mult;
                w = Math.max(1, w);
                h = Math.max(1, h);
                const limit = state.limit;
                w = Math.min(limit, w);
                h = Math.min(limit, h);
                state.width = w;
                state.height = h;
                state.rawWidth = w;
                state.rawHeight = h;
                updateAllDisplay();
            }
            state.ctrlDown = false;
            state.shiftDown = false;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
        window.addEventListener('touchmove', (e) => { if (state.isDragging) { e.preventDefault(); onPointerMove(e); } }, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Control' || e.key === 'Meta') { state.ctrlDown = true; }
            if (e.key === 'Shift') { state.shiftDown = true; }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'Control' || e.key === 'Meta') { state.ctrlDown = false; }
            if (e.key === 'Shift') { state.shiftDown = false; }
        });

        // -------- Resize --------
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { drawCanvas(); }, 100);
        });

        // -------- 初始化 --------
        function init() {
            state.limit = 4096;
            state.align = 8;
            alignMultiple.value = 8;
            state.useOptimized = true;
            algToggle.textContent = '优';
            algToggle.classList.add('opt');

            const initialBatch = parseInt(batchStep.value);
            if (!isNaN(initialBatch) && initialBatch >= 1) {
                state.batchSize = initialBatch;
            }

            renderAspectSelect();
            renderPresetSelect();

            const defaultPreset = presets.find(p => p.name.includes('方形') || p.name.includes('1:1'));
            if (defaultPreset) {
                state.selectedPresetName = defaultPreset.name;
                applyBestLimit(defaultPreset.width, defaultPreset.height);
                const aligned = applyAlignmentAndLimit(defaultPreset.width, defaultPreset.height);
                state.width = aligned.w;
                state.height = aligned.h;
                state.rawWidth = aligned.w;
                state.rawHeight = aligned.h;
                presetSelect.value = defaultPreset.name;
                aspectSelect.value = '1:1';
                state.selectedRatioLabel = '1:1';
                megapixelsInput.value = '1.0';
                updateAllDisplay();
                setTimeout(() => drawCanvas(), 10);
            } else {
                applyBestLimit(1024, 1024);
                const aligned = applyAlignmentAndLimit(1024, 1024);
                state.width = aligned.w;
                state.height = aligned.h;
                state.rawWidth = aligned.w;
                state.rawHeight = aligned.h;
                megapixelsInput.value = '1.0';
                aspectSelect.value = '1:1';
                state.selectedRatioLabel = '1:1';
                updateAllDisplay();
                setTimeout(() => drawCanvas(), 10);
            }

            console.log('🎯 分辨率选择器 独立预设版 loaded');
        }
        init();
    </script>
</body>
</html>
