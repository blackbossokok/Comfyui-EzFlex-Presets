[project]
name = "Comfyui-EzFlex-Presets"
version = "1.0.4"
description = "EzFlex 预设套件：模型组合加载器、分辨率选择器、节点控制总预设/分组预设/总控制、参数预设控制/输出、任意预览、提示词助手、素材加载器/输出。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "blackbossokok" }]
keywords = ["ComfyUI", "custom-node", "EzFlex", "ModelsCombo", "FreeLatent", "ParamPreset", "PreviewAny"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
license = { text = "MIT" }
dependencies = ["mutagen>=1.46.0"]

[project.urls]
Repository = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Homepage = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Issues = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets/issues"

[project.optional-dependencies]
all = ["mutagen>=1.46.0"]
