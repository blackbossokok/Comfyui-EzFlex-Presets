[project]
name = "Comfyui-EzFlex-Presets"
version = "1.2.0"
description = "EzFlex preset suite for ComfyUI: models combo loader, resolution/latent selector, node switch master & group presets, parameter presets, preview any, prompt helper, media loader/output."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "blackbossokok" }]
keywords = [
    "ComfyUI", "custom-node", "EzFlex",
    "ModelsCombo", "FreeLatent", "NodeSwitch", "ParamPreset",
    "PromptHelper", "MediaLoader", "MediaOut", "PreviewAny",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
license = { text = "MIT" }
# 唯一必须额外安装的依赖：读音频/视频标签与容器元数据（torch / numpy / Pillow / safetensors / av 由 ComfyUI 自带）
dependencies = ["mutagen>=1.46.0"]

[project.urls]
Repository = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Homepage = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Issues = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets/issues"

[tool.comfy]
# Registry metadata (docs.comfy.org/registry/specifications).
# PublisherId 必填：必须与 registry.comfy.org 上你的 publisher id 完全一致（comfy node init 会写进去）。
# PublisherId = ""
DisplayName = "EzFlex Presets"
requires-comfyui = ">=0.3.13"   # 用到官方 i18n（GET /i18n，ComfyUI 0.3.13 起）

[project.optional-dependencies]
# 可选：提示词助手「进程内 llama-cpp-python」模式需要（用 llama.cpp 服务器模式则不用）
llama = ["llama-cpp-python"]
# 可选：只有读 .gguf / .onnx 模型文件时才会用到，缺了会跳过该文件的「模型元数据卡」
metadata = ["gguf", "onnx"]
