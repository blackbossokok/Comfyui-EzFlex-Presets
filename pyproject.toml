# Comfyui-EzFlex-Presets — ComfyUI custom node package manifest.
# 说明：ComfyUI-Manager 通过本文件的 [project] 元数据读取版本/描述/依赖；仓库安装走 git clone（custom_nodes）。
# 若你希望在 PyPI 上发布（可选），再补一个 LICENSE 文件并在这里加上 license 字段。
[project]
name = "Comfyui-EzFlex-Presets"
version = "1.0.2"
description = "EzFlex 预设套件：模型组合加载器、分辨率选择器、节点控制总预设/分组预设/总控制、参数预设控制/输出、任意预览。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "blackbossokok" }]
keywords = ["ComfyUI", "custom-node", "EzFlex", "ModelsCombo", "FreeLatent", "ParamPreset", "PreviewAny"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
license = { text = "MIT" }
dependencies = ["mutagen>=1.46.0"]

[project.urls]
Repository = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Homepage = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets"
Issues = "https://github.com/blackbossokok/Comfyui-EzFlex-Presets/issues"

[project.optional-dependencies]
all = ["mutagen>=1.46.0"]
